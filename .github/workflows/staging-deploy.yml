name: Validate and Publish Staging

on:
  pull_request:
    branches:
      - v2
  push:
    branches:
      - v2
  workflow_dispatch:

concurrency:
  group: portfolio-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: harbor.rcrumana.xyz/apps-private/portfolio
  BUILDKIT_PROGRESS: plain
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  validate-frontend:
    name: Validate frontend
    runs-on: [self-hosted, portfolio-dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Astro checks
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npm exec -- playwright install chromium

      - name: Run browser and accessibility checks
        working-directory: frontend
        run: npm run test:e2e

  validate-rust:
    name: Validate ${{ matrix.component }}
    runs-on: [self-hosted, portfolio-dev]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            target: backend-validator
          - component: WebAssembly
            target: wasm-validator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run ${{ matrix.component }} validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.staging
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=portfolio-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=portfolio-${{ matrix.target }}

  publish:
    name: Publish immutable staging image
    if: github.event_name != 'pull_request'
    needs:
      - validate-frontend
      - validate-rust
    runs-on: [self-hosted, portfolio-dev]
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_digest: ${{ steps.release.outputs.image_digest }}
      image_ref: ${{ steps.release.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.rcrumana.xyz
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.staging
          push: true
          tags: >-
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=portfolio-staging-image
          cache-to: type=gha,mode=max,scope=portfolio-staging-image

      - name: Record GitOps handoff
        id: release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: >-
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE_REF="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

          {
            echo "image_tag=${IMAGE_TAG}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "image_ref=${IMAGE_REF}"
          } >> "${GITHUB_OUTPUT}"

          mkdir -p release-metadata
          {
            echo "source_repository=${GITHUB_REPOSITORY}"
            echo "source_revision=${GITHUB_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "image_ref=${IMAGE_REF}"
            echo "gitops_repository=rrumana/k8s-homelab-2"
            echo "gitops_manifest=cluster/apps/web/portfolio/staging/deployment.yaml"
          } > release-metadata/staging-image.env

          {
            echo "### Staging image published"
            echo
            echo "- Immutable tag: \`${IMAGE_TAG}\`"
            echo "- Digest reference: \`${IMAGE_REF}\`"
            echo
            echo "No cluster mutation was performed. Update"
            echo "\`cluster/apps/web/portfolio/staging/deployment.yaml\` in"
            echo "\`rrumana/k8s-homelab-2\` to the digest reference above; Argo CD"
            echo "will reconcile the \`web/portfolio-staging\` Deployment."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: staging-image-${{ github.sha }}-${{ github.run_id }}
          path: release-metadata/staging-image.env
          if-no-files-found: error
          retention-days: 30
