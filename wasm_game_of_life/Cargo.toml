[package]
name = "wasm_game_of_life"
version = "0.1.0"
edition = "2024"
description = "WebAssembly Game of Life engine for rcrumana.xyz"
repository = "https://github.com/rrumana/portfolio"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
web-sys = "0.3.103"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
rayon = "1.12.0"
log = "0.4.33"
console_log = "1.1.0"
console_error_panic_hook = "0.1.7"
gif = "0.14.2"

# Local dependencies
gol = { path = "../../game_of_life/crates/gol" }
text_to_input = { path = "../../game_of_life/crates/text_to_input" }
