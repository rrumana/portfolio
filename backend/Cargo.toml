[package]
name = "backend"
version = "0.1.0"
edition = "2024"
description = "Axum backend for rcrumana.xyz"
repository = "https://github.com/rrumana/portfolio"
license = "MIT"
publish = false

[[bin]]
name = "portfolio" 
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["full"] }
tower = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rayon = "1.12.0"
log = "0.4.33"
log4rs = { version = "1.4.0", features = ["json_encoder"] }
uuid = { version = "1.24.0", features = ["v4", "fast-rng"] }

[dev-dependencies]
hyper = "1.11.0"
serde_json = "1.0.151"
